name: Run DEFOG Daily Update

on:
  workflow_call:
    secrets:
      SF_USERNAME:
        required: true
      SF_ACCOUNT:
        required: true
      SF_PRIVATE_KEY:
        required: true
      SF_PRIVATE_KEY_PASSPHRASE:
        required: false

jobs:
  defog-daily-update:
    name: DEFOG Daily Update
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python

      - name: Setup Snowflake Key Pair
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SF_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Write the private key to a file and expose the path (and
          # passphrase, since the key is encrypted) for key pair (JWT)
          # authentication.
          key_path="$RUNNER_TEMP/snowflake_test_key.p8"
          printf '%s\n' "$SF_PRIVATE_KEY" > "$key_path"
          echo "SF_PRIVATE_KEY_FILE=$key_path" >> "$GITHUB_ENV"
          echo "SF_PRIVATE_KEY_FILE_PWD=$SF_PRIVATE_KEY_PASSPHRASE" >> "$GITHUB_ENV"
        shell: bash

      - name: Run DEFOG_DAILY_UPDATE if table is older than 1 day
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          python << 'EOF'
          import snowflake.connector
          import os

          conn = snowflake.connector.connect(
              user=os.environ['SF_USERNAME'],
              account=os.environ['SF_ACCOUNT'],
              authenticator='snowflake_jwt',
              private_key_file=os.environ['SF_PRIVATE_KEY_FILE'],
              private_key_file_pwd=os.environ.get('SF_PRIVATE_KEY_FILE_PWD') or None,
              warehouse='DEMO_WH',
              database='DEFOG',
              schema='BROKER',
          )

          cursor = conn.cursor()
          
          # Sqlite's datetime functions operate in UTC, 
          # while Snowflake's default timezone is Pacific Time.
          # Setting the session timezone to match SQLite's behavior 
          # to ensure the date comparison is accurate.
          cursor.execute("ALTER SESSION SET TIMEZONE = 'UTC'")

          # Check if table data is a day or more old. 
          # If so, run the stored procedure to update it.
          cursor.execute("""
                DECLARE last_mod DATE;

                BEGIN
                    -- Get table last modified date
                    SELECT DATE(LAST_ALTERED) INTO last_mod
                    FROM INFORMATION_SCHEMA.TABLES
                    WHERE table_catalog='DEFOG'
                        AND table_schema = 'BROKER'
                        AND table_name = 'SBDAILYPRICE';

                    -- If last modified is before today (UTC), call the procedure
                    IF (last_mod < CURRENT_DATE()) THEN
                        CALL DEFOG.BROKER.DEFOG_DAILY_UPDATE();
                    END IF;
                END;
          """)
          
          cursor.close()
          conn.close()
          EOF
