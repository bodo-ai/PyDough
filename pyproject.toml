[project]
name = "pydough"
dynamic = ["version"]
keywords = ["analytics"]
description = "Analytics DSL for Python"
readme = "README.md"
authors = [{name = "Bodo.ai"}]
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Note: sqlite is included in the standard library, so it doesn't need to be 
# listed here.
# As of August 2026 LLM team work requires pyarrow=22.0.0, but
# BodoSQL requires latest version of pyarrow.
# So we are not specifying any version for pyarrow here to avoid conflicts and
# allow other packages to specify their own version of pyarrow.
dependencies = ["pytz", "sqlglot==30.18.0", "pandas>=2.0.0", "jupyterlab", "pyarrow"]

[project.urls]
# TODO: Add homepage + documentation when docs are live.
Repository = "https://github.com/bodo-ai/PyDough"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff==0.6.7",
    "pytest-repeat",
    "boto3",
    "pydough[snowflake]",
    "pydough[trino]",
    "pydough[mysql]",
    "pydough[postgres]",
    "pydough[server]",
    "pydough[bodosql]",
    "pydough[oracle]",
    "pydough[databricks]",
    "pydough[duckdb]",
    "pymongo",
    "cassandra-driver",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]==4.7.3"]
trino = ["trino"]
mysql = ["mysql-connector-python==9.5.0"]
postgres = ["psycopg2-binary"]
server = ["fastapi", "httpx", "uvicorn"]
bodosql = ["bodo>=2026.2", "bodosql>=2026.2", "pyiceberg[pyiceberg-core]==0.12.0"]
oracle = ["oracledb==3.4.2"]
databricks = ["databricks-sql-connector==4.2.6"]
duckdb = ["duckdb>=1.5.4"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
unsafe-fixes = true
# Ruff 0.16 expanded its default rule set from 59 to 413 rules. Pin `select`
# back to the pre-0.16 defaults so `extend-select` below continues to extend
# the same small baseline instead of the much larger new default.
lint.select = [
    "E4",
    "E7",
    "E9",
    "F",
]
lint.extend-select = [
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "TID", # flake8-tidy-imports
]

lint.ignore = [
    "UP038",
]
# Don't run ruff on any ipython notebooks as they may have
# names that don't statically resolve.
exclude = ["**/*.ipynb"]

[tool.mypy]
# Don't run mypy on any ipython notebooks
exclude = '.*\.ipynb$'
