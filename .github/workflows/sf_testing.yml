name: Run Snowflake Tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON string of Python versions"
        type: string
        required: true
    secrets:
      SF_USERNAME:
        required: true
      SF_ACCOUNT:
        required: true
      SF_PRIVATE_KEY:
        required: true
      SF_PRIVATE_KEY_PASSPHRASE:
        required: false

jobs:
  sf-tests:
    name: Snowflake Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    env:
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Snowflake Key Pair
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SF_PRIVATE_KEY_PASSPHRASE }}
        run: |
          # Write the private key (if configured) to a file and expose the
          # path (and passphrase, since the key is encrypted) to the tests
          # for key pair (JWT) authentication.
          if [[ -n "$SF_PRIVATE_KEY" ]]; then
            key_path="$RUNNER_TEMP/snowflake_test_key.p8"
            printf '%s\n' "$SF_PRIVATE_KEY" > "$key_path"
            echo "SF_PRIVATE_KEY_FILE=$key_path" >> "$GITHUB_ENV"
            echo "SF_PRIVATE_KEY_FILE_PWD=$SF_PRIVATE_KEY_PASSPHRASE" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Setup Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.6.0"

      - name: Create virtual environment
        # uv requires an existing virtual environment to install packages.
        # Running `uv venv` creates the `.venv` directory so that subsequent
        # `uv pip install` commands install dependencies inside this environment.
        # Without this step, `uv pip install` fails with 
        # "No virtual environment found".
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[snowflake]"

      - name: Confirm Snowflake connector is installed
        run: uv run python -c "import snowflake.connector; print(snowflake.connector.__version__)"

      - name: Run Snowflake Tests
        run: uv run pytest -m snowflake tests/ -rs
